<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <img src="C:\Users\kobeg\Downloads\Oraclebonz_edited.png" alt="Logo" class="logo-img">
    <div class="logo-text">T. Kamman</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Works</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Follow Me Section -->
    <div class="follow-me">
      <h3>Follow me</h3>
      <ul>
        <li><a href="mailto:someone@example.com">Email</a></li>
        <li><a href="https://www.facebook.com/teresa.herzog.55" target="_blank">Facebook</a></li>
        <li><a href="https://tiktok.com" target="_blank">Booktok</a></li>
      </ul>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
      <h3>Send me a message</h3>
      <form>
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your first name..">
        
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your last name..">
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email..">
        
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write something.." style="height:100px"></textarea>

        <button type="submit">Post</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <p>OracleBonz.com</p>
    </div>
    <div class="footer-center">
      <h3>Sign up with your email to earn a free copy of the novella</h3>
      <input type="email" placeholder="Email address">
      <button type="submit">Submit</button>
    </div>
    <div class="footer-right">
      <p>Explore</p>
      <p>About | Works | Contact</p>
      <p>Follow Me: Email | Facebook | Booktok</p>
    </div>
  </footer>

</body>
</html>
