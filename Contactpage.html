<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Layout</title>
  <style>
    /* General Styling */
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'EB Garamond', serif;
      background-color: #8DDCDC;
    }

    a {
      text-decoration: none;
    }

    /* Navbar */
    .navbar {
      background: #FFFDD0;
      height: 120px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .navbar .logo {
      font-size: 50px;
    }

    .navbar ul {
      display: flex;
      gap: 20px;
    }

    .navbar ul li {
      list-style: none;
    }

    .navbar ul li a {
      font-size: 20px;
      color: black;
      padding: 10px;
      border-radius: 3px;
      text-transform: uppercase;
      transition: background-color 0.5s;
    }

    .navbar ul li a:hover {
      background-color: black;
      color: white;
    }

    /* Main Content */
    .main-content {
      display: flex;
      padding: 40px;
    }

    .main-content .follow-me {
      flex: 1;
    }

    .follow-me ul {
      list-style: none;
    }

    .follow-me ul li {
      margin: 10px 0;
      font-size: 18px;
    }

    .follow-me ul li::before {
      content: '';
      display: inline-block;
      width: 15px;
      height: 15px;
      background-color: #C4C4C4;
      border-radius: 50%;
      margin-right: 10px;
    }

    /* Contact Form */
    .contact-form {
      flex: 2;
      background-color: #FFFDD0;
      padding: 20px;
      border-radius: 10px;
    }

    .contact-form input, 
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .contact-form button {
      padding: 10px 20px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Footer */
    .footer {
      background-color: #FFFDD0;
      padding: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer .footer-left,
    .footer .footer-right {
      flex: 1;
    }

    .footer .footer-center {
      flex: 2;
      text-align: center;
    }

    .footer .footer-center input {
      width: 60%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-right: 10px;
    }

    .footer .footer-center button {
      padding: 10px 20px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <img src="your-logo-path.png" alt="Logo" width="60px" height="60px">
    <div class="logo">T. Kamman</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Works</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Follow Me Section -->
    <div class="follow-me">
      <h3>Follow me</h3>
      <ul>
        <li>Email</li>
        <li>Facebook</li>
        <li>Booktok</li>
      </ul>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
      <h3>Send me a message</h3>
      <form>
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your first name..">
        
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your last name..">
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email..">
        
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write something.." style="height:100px"></textarea>

        <button type="submit">Post</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <p>OracleBonz.com</p>
    </div>
    <div class="footer-center">
      <h3>Sign up with your email to earn a free copy of the novella</h3>
      <input type="email" placeholder="Email address">
      <button type="submit">Submit</button>
    </div>
    <div class="footer-right">
      <p>Explore</p>
      <p>About | Works | Contact</p>
      <p>Follow Me: Email | Facebook | Booktok</p>
    </div>
  </footer>

</body>
</html>
